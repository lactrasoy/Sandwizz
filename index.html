<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>คำนวณต้นทุนแซนวิช</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@600;700;800&family=Sarabun:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#241a12;
    --paper:#f2e6c9;
    --paper-dark:#e7d7ac;
    --board:#221a14;
    --board-2:#2c2119;
    --mustard:#d9a62e;
    --mustard-dark:#b8871c;
    --avocado:#6f8f43;
    --avocado-dark:#566f34;
    --tomato:#c1442d;
    --line:#c9b98a;
    --shadow: 0 18px 40px rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% 10%, rgba(217,166,46,0.08), transparent 40%),
      radial-gradient(circle at 90% 80%, rgba(111,143,67,0.10), transparent 45%),
      var(--board);
    color:var(--ink);
    font-family:'Sarabun', sans-serif;
    min-height:100vh;
    padding:32px 16px 80px;
  }
  .top{
    max-width:1120px;
    margin:0 auto 28px;
    text-align:center;
    color:var(--paper);
  }
  .top .eyebrow{
    font-family:'JetBrains Mono', monospace;
    letter-spacing:0.35em;
    font-size:11px;
    color:var(--mustard);
    text-transform:uppercase;
  }
  .top h1{
    font-family:'Kanit', sans-serif;
    font-weight:800;
    font-size:clamp(28px, 4.5vw, 44px);
    margin:8px 0 6px;
    letter-spacing:0.01em;
  }
  .top p{
    margin:0;
    color:#cbb98a;
    font-size:14.5px;
  }

  .layout{
    max-width:1120px;
    margin:0 auto;
    display:grid;
    grid-template-columns:1.62fr 1fr;
    gap:28px;
    align-items:start;
  }
  @media (max-width:900px){
    .layout{grid-template-columns:1fr;}
  }

  /* ===== Ticket (main form) ===== */
  .ticket{
    background:var(--paper);
    border-radius:6px;
    box-shadow:var(--shadow);
    position:relative;
    overflow:hidden;
  }
  .ticket::before{
    content:"";
    position:absolute; top:0; left:0; right:0; height:6px;
    background:repeating-linear-gradient(90deg, var(--board) 0 10px, transparent 10px 20px);
  }
  .ticket-inner{padding:30px 26px 26px;}

  .section{
    border-top:1px dashed var(--line);
    padding-top:18px;
    margin-top:18px;
  }
  .section:first-child{border-top:none; margin-top:0; padding-top:0;}

  .section-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:10px;
    margin-bottom:14px;
  }
  .section-head h2{
    font-family:'Kanit', sans-serif;
    font-weight:700;
    font-size:18px;
    margin:0;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .section-head h2 .tag{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:#8a7a4f;
    letter-spacing:0.08em;
  }

  .servings-row{
    display:flex;
    align-items:center;
    gap:14px;
    flex-wrap:wrap;
  }
  .servings-row label{
    font-weight:600;
    font-size:15px;
  }
  .num-input{
    font-family:'JetBrains Mono', monospace;
    font-size:20px;
    font-weight:700;
    width:110px;
    padding:8px 10px;
    border:2px solid var(--ink);
    border-radius:4px;
    background:#fffdf6;
    color:var(--ink);
  }
  .unit-suffix{
    font-size:14px;
    color:#5b4d32;
  }

  /* ingredient line items */
  .line-item{
    border:1px solid var(--line);
    background:rgba(255,253,246,0.55);
    border-radius:5px;
    padding:12px 12px 10px;
    margin-bottom:10px;
    position:relative;
  }
  .line-item .grid{
    display:grid;
    grid-template-columns:1.5fr 1fr 1fr 0.8fr 1fr 0.8fr;
    gap:8px;
  }
  @media (max-width:640px){
    .line-item .grid{grid-template-columns:1fr 1fr;}
  }
  .field{display:flex; flex-direction:column; gap:3px;}
  .field label{
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:0.05em;
    color:#8a7a4f;
    font-weight:600;
  }
  .field input{
    font-family:'Sarabun', sans-serif;
    font-size:14px;
    padding:6px 7px;
    border:1px solid #b9a878;
    border-radius:3px;
    background:#fffdf8;
    color:var(--ink);
    width:100%;
  }
  .field input:focus{
    outline:none;
    border-color:var(--mustard-dark);
    box-shadow:0 0 0 2px rgba(217,166,46,0.25);
  }
  .field.num input{font-family:'JetBrains Mono', monospace;}

  .line-item .foot{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:9px;
    padding-top:8px;
    border-top:1px dotted #b9a878;
  }
  .cost-readout{
    font-family:'JetBrains Mono', monospace;
    font-size:13.5px;
    color:#4a3d22;
  }
  .cost-readout b{color:var(--tomato); font-size:15px;}

  .btn{
    font-family:'Sarabun', sans-serif;
    font-weight:600;
    font-size:13px;
    border:none;
    border-radius:4px;
    padding:7px 12px;
    cursor:pointer;
    transition:transform 0.08s ease, filter 0.15s ease;
  }
  .btn:active{transform:scale(0.96);}
  .btn-remove{
    background:none;
    color:var(--tomato);
    font-size:12px;
    padding:4px 8px;
    text-decoration:underline;
    text-underline-offset:2px;
  }
  .btn-remove:hover{filter:brightness(1.15);}
  .btn-add{
    background:var(--avocado);
    color:#fbf6e3;
  }
  .btn-add:hover{background:var(--avocado-dark);}

  /* equipment / drink simple list */
  .simple-item{
    display:grid;
    grid-template-columns:2fr 1fr auto;
    gap:8px;
    align-items:end;
    margin-bottom:8px;
  }
  @media (max-width:480px){
    .simple-item{grid-template-columns:1.3fr 1fr auto;}
  }

  .empty-hint{
    font-size:12.5px;
    color:#8a7a4f;
    font-style:italic;
    margin-bottom:8px;
  }

  /* ===== Receipt (summary) ===== */
  .receipt-sticky{position:sticky; top:24px;}
  .receipt{
    background:#fffdf6;
    border-radius:2px;
    box-shadow:var(--shadow);
    font-family:'JetBrains Mono', monospace;
    color:#241a12;
    padding:26px 22px 0;
    position:relative;
  }
  .receipt-head{
    text-align:center;
    margin-bottom:16px;
  }
  .receipt-head .name{
    font-family:'Kanit', sans-serif;
    font-weight:800;
    font-size:18px;
    letter-spacing:0.06em;
  }
  .receipt-head .sub{
    font-size:10.5px;
    color:#8a7a4f;
    letter-spacing:0.12em;
    margin-top:2px;
  }
  .receipt hr{
    border:none;
    border-top:1px dashed #b9a878;
    margin:12px 0;
  }
  .rline{
    display:flex;
    justify-content:space-between;
    gap:8px;
    font-size:12.5px;
    padding:3px 0;
    color:#3a2f1c;
  }
  .rline .lbl{
    overflow:hidden;
    white-space:nowrap;
  }
  .rline .val{white-space:nowrap;}
  .rline.sub{
    font-size:12px;
    color:#8a7a4f;
    font-weight:700;
    padding-top:6px;
  }
  .rline.grand{
    font-size:16px;
    font-weight:700;
    padding:8px 0;
  }
  .rline.perpiece{
    font-size:13px;
    color:#4a3d22;
  }

  .stamp{
    margin:14px auto 0;
    width:fit-content;
    border:3px solid var(--tomato);
    color:var(--tomato);
    font-family:'Kanit', sans-serif;
    font-weight:800;
    font-size:22px;
    padding:6px 22px;
    border-radius:6px;
    transform:rotate(-4deg);
    opacity:0.9;
    letter-spacing:0.03em;
  }

  .torn{
    height:16px;
    margin-top:18px;
    background:
      linear-gradient(-45deg, #fffdf6 8px, transparent 0) 0 8px,
      linear-gradient(45deg, #fffdf6 8px, transparent 0) 0 8px;
    background-size:16px 16px;
    background-repeat:repeat-x;
    background-color:transparent;
  }

  .foot-note{
    text-align:center;
    color:#7a6a44;
    font-size:10px;
    letter-spacing:0.08em;
    padding:10px 0 18px;
  }
  .reset-link{
    background:none;
    border:none;
    color:#7a6a44;
    font-size:10px;
    letter-spacing:0.08em;
    text-decoration:underline;
    text-underline-offset:2px;
    cursor:pointer;
    font-family:'Sarabun', sans-serif;
    padding:0;
  }
  .reset-link:hover{color:var(--tomato);}

  /* mobile sticky total bar */
  .mobile-bar{
    display:none;
  }
  @media (max-width:900px){
    .mobile-bar{
      display:flex;
      position:fixed;
      left:0; right:0; bottom:0;
      background:var(--board-2);
      color:var(--paper);
      padding:10px 16px calc(10px + env(safe-area-inset-bottom));
      justify-content:space-between;
      align-items:center;
      font-family:'JetBrains Mono', monospace;
      box-shadow:0 -8px 20px rgba(0,0,0,0.4);
      z-index:10;
    }
    .mobile-bar .l{font-size:11px; color:#cbb98a; letter-spacing:0.05em;}
    .mobile-bar .v{font-size:18px; font-weight:700; color:var(--mustard);}
  }
</style>
</head>
<body>

  <div class="top">
    <div class="eyebrow">Order Ticket &middot; Cost Sheet</div>
    <h1>คำนวณต้นทุนแซนวิช</h1>
    <p>ใส่จำนวนที่จะทำ ปรับวัตถุดิบ อุปกรณ์ และเครื่องดื่ม ระบบจะบันทึกให้อัตโนมัติในเบราว์เซอร์นี้</p>
  </div>

  <div class="layout">
    <!-- ===== MAIN TICKET / FORM ===== -->
    <div class="ticket">
      <div class="ticket-inner">

        <div class="section">
          <div class="section-head">
            <h2>จำนวนที่ต้องทำ <span class="tag">BATCH SIZE</span></h2>
          </div>
          <div class="servings-row">
            <label for="servings">ทำแซนวิชทั้งหมด</label>
            <input type="number" id="servings" class="num-input" value="56" min="0" step="1">
            <span class="unit-suffix">อัน</span>
          </div>
        </div>

        <div class="section">
          <div class="section-head">
            <h2>วัตถุดิบ <span class="tag">INGREDIENTS</span></h2>
            <button class="btn btn-add" onclick="addIngredient()">+ เพิ่มวัตถุดิบ</button>
          </div>
          <div id="ingredientList"></div>
        </div>

        <div class="section">
          <div class="section-head">
            <h2>อุปกรณ์ <span class="tag">PACKAGING</span></h2>
            <button class="btn btn-add" onclick="addEquipment()">+ เพิ่มรายการ</button>
          </div>
          <div id="equipmentList"></div>
        </div>

        <div class="section">
          <div class="section-head">
            <h2>เครื่องดื่ม <span class="tag">DRINKS</span></h2>
            <button class="btn btn-add" onclick="addDrink()">+ เพิ่มรายการ</button>
          </div>
          <div id="drinkList"></div>
        </div>

      </div>
    </div>

    <!-- ===== RECEIPT / SUMMARY ===== -->
    <div class="receipt-sticky">
      <div class="receipt">
        <div class="receipt-head">
          <div class="name">SENDWIZ</div>
          <div class="sub">ใบสรุปต้นทุน &middot; COST RECEIPT</div>
        </div>

        <div id="ingredientReceipt"></div>
        <div class="rline sub" id="sandwichSubtotalLine"></div>

        <hr>
        <div id="equipmentReceipt"></div>
        <div class="rline sub" id="equipmentSubtotalLine"></div>

        <hr>
        <div id="drinkReceipt"></div>
        <div class="rline sub" id="drinkSubtotalLine"></div>

        <hr>
        <div class="rline grand" id="grandTotalLine"></div>
        <div class="rline perpiece" id="perPieceLine"></div>

        <div class="stamp" id="stampTotal">฿0.00</div>
        <div class="torn"></div>
      </div>
      <div class="foot-note">
        <span id="savedNote"></span>
        &middot; <button class="reset-link" onclick="resetToDefaults()">ล้างและเริ่มใหม่</button>
      </div>
    </div>
  </div>

  <div class="mobile-bar">
    <div><div class="l">ต้นทุนรวมทั้งหมด</div></div>
    <div class="v" id="mobileTotal">฿0.00</div>
  </div>

<script>
const STORAGE_KEY = 'sendwiz_cost_calc_v1';

let idCounter = 0;
const nextId = () => 'i' + (idCounter++);

// seeded from the uploaded spreadsheet — used only if nothing saved yet
const DEFAULT_INGREDIENTS = [
  {name:'ขนมปัง',   priceUnit:38,  packQty:18, packUnit:'แพ็ค', used:1.5, useUnit:'แผ่น'},
  {name:'โบโลน่า',  priceUnit:75,  packQty:40, packUnit:'ถุง',  used:0.5, useUnit:'อัน'},
  {name:'ไส้กรอก',  priceUnit:77,  packQty:20, packUnit:'ถุง',  used:1,   useUnit:'ชิ้น'},
  {name:'ไข่',      priceUnit:110, packQty:30, packUnit:'แผง',  used:0.5, useUnit:'ฟอง'},
];
const DEFAULT_EQUIPMENT = [
  {name:'กล่องใส่', cost:0},
  {name:'กระดาษรอง', cost:0},
  {name:'ทิชชู่', cost:0},
];
const DEFAULT_DRINKS = [];
const DEFAULT_SERVINGS = 56;

let ingredients = [];
let equipment = [];
let drinks = [];

function withIds(list){
  return list.map(it => ({ id: nextId(), ...it }));
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const saved = JSON.parse(raw);
      ingredients = withIds(saved.ingredients || DEFAULT_INGREDIENTS);
      equipment   = withIds(saved.equipment || DEFAULT_EQUIPMENT);
      drinks      = withIds(saved.drinks || DEFAULT_DRINKS);
      document.getElementById('servings').value = (saved.servings !== undefined ? saved.servings : DEFAULT_SERVINGS);
      showSavedNote(saved.savedAt);
      return;
    }
  }catch(e){
    console.warn('โหลดข้อมูลที่บันทึกไว้ไม่สำเร็จ', e);
  }
  // no saved data (or read failed) — use defaults
  ingredients = withIds(DEFAULT_INGREDIENTS);
  equipment   = withIds(DEFAULT_EQUIPMENT);
  drinks      = withIds(DEFAULT_DRINKS);
  document.getElementById('servings').value = DEFAULT_SERVINGS;
}

function saveState(){
  try{
    const payload = {
      servings: getServings(),
      ingredients: ingredients.map(({id, ...rest}) => rest),
      equipment: equipment.map(({id, ...rest}) => rest),
      drinks: drinks.map(({id, ...rest}) => rest),
      savedAt: new Date().toISOString(),
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
    showSavedNote(payload.savedAt);
  }catch(e){
    console.warn('บันทึกข้อมูลไม่สำเร็จ (อาจเป็นเพราะเปิดในโหมดไม่ระบุตัวตน)', e);
  }
}

function showSavedNote(iso){
  const el = document.getElementById('savedNote');
  if(!el) return;
  if(!iso){ el.textContent = ''; return; }
  const d = new Date(iso);
  const time = d.toLocaleTimeString('th-TH', {hour:'2-digit', minute:'2-digit'});
  el.textContent = `บันทึกล่าสุด ${time}`;
}

function resetToDefaults(){
  if(!confirm('ล้างข้อมูลทั้งหมดและกลับไปใช้ค่าเริ่มต้นจากไฟล์ Excel เดิม?')) return;
  try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
  ingredients = withIds(DEFAULT_INGREDIENTS);
  equipment   = withIds(DEFAULT_EQUIPMENT);
  drinks      = withIds(DEFAULT_DRINKS);
  document.getElementById('servings').value = DEFAULT_SERVINGS;
  showSavedNote(null);
  renderAll();
  saveState();
}


function money(n){
  if(!isFinite(n)) n = 0;
  return '฿' + n.toLocaleString('th-TH', {minimumFractionDigits:2, maximumFractionDigits:2});
}
function num(n, digits){
  if(!isFinite(n)) n = 0;
  return n.toLocaleString('th-TH', {minimumFractionDigits:0, maximumFractionDigits: digits===undefined?2:digits});
}

function getServings(){
  const v = parseFloat(document.getElementById('servings').value);
  return isFinite(v) ? v : 0;
}

function addIngredient(){
  ingredients.push({id: nextId(), name:'', priceUnit:0, packQty:1, packUnit:'แพ็ค', used:0, useUnit:''});
  renderAll();
  saveState();
}
function removeIngredient(id){
  ingredients = ingredients.filter(x => x.id !== id);
  renderAll();
  saveState();
}
function addEquipment(){
  equipment.push({id: nextId(), name:'', cost:0});
  renderAll();
  saveState();
}
function removeEquipment(id){
  equipment = equipment.filter(x => x.id !== id);
  renderAll();
  saveState();
}
function addDrink(){
  drinks.push({id: nextId(), name:'', cost:0});
  renderAll();
  saveState();
}
function removeDrink(id){
  drinks = drinks.filter(x => x.id !== id);
  renderAll();
  saveState();
}

function updateIngredientField(id, field, value){
  const it = ingredients.find(x => x.id === id);
  if(!it) return;
  if(field === 'name' || field === 'useUnit' || field === 'packUnit'){
    it[field] = value;
  } else {
    const v = parseFloat(value);
    it[field] = isFinite(v) ? v : 0;
  }
  updateIngredientReadout(it);
  computeAndRenderReceipt();
  saveState();
}
function updateIngredientReadout(it){
  const el = document.getElementById('readout-' + it.id);
  if(!el) return;
  const servings = getServings();
  const totalUsed = it.used * servings;
  const packsNeeded = it.packQty > 0 ? totalUsed / it.packQty : 0;
  const cost = packsNeeded * it.priceUnit;
  el.innerHTML = `ใช้ทั้งหมด ${num(totalUsed)} ${escapeHtml(it.useUnit)} &middot; ซื้อ ${num(packsNeeded, 3)} ${escapeHtml(it.packUnit)} &rarr; <b>${money(cost)}</b>`;
}
function updateSimpleField(list, id, field, value){
  const it = list.find(x => x.id === id);
  if(!it) return;
  if(field === 'name'){
    it.name = value;
  } else {
    const v = parseFloat(value);
    it.cost = isFinite(v) ? v : 0;
  }
  computeAndRenderReceipt();
  saveState();
}

function renderIngredientForm(){
  const wrap = document.getElementById('ingredientList');
  if(ingredients.length === 0){
    wrap.innerHTML = '<div class="empty-hint">ยังไม่มีวัตถุดิบ กด "เพิ่มวัตถุดิบ" เพื่อเริ่มเพิ่มรายการ</div>';
    return;
  }
  const servings = getServings();
  wrap.innerHTML = ingredients.map(it => {
    const totalUsed = it.used * servings;
    const packsNeeded = it.packQty > 0 ? totalUsed / it.packQty : 0;
    const cost = packsNeeded * it.priceUnit;
    return `
    <div class="line-item">
      <div class="grid">
        <div class="field">
          <label>ชื่อวัตถุดิบ</label>
          <input type="text" value="${escapeAttr(it.name)}" placeholder="เช่น ขนมปัง"
            oninput="updateIngredientField('${it.id}','name',this.value)">
        </div>
        <div class="field num">
          <label>ราคา/แพ็ค (บาท)</label>
          <input type="number" step="0.01" value="${it.priceUnit}"
            oninput="updateIngredientField('${it.id}','priceUnit',this.value)">
        </div>
        <div class="field num">
          <label>จำนวน/แพ็ค</label>
          <input type="number" step="0.01" value="${it.packQty}"
            oninput="updateIngredientField('${it.id}','packQty',this.value)">
        </div>
        <div class="field">
          <label>หน่วยแพ็ค</label>
          <input type="text" value="${escapeAttr(it.packUnit)}" placeholder="แพ็ค/ถุง"
            oninput="updateIngredientField('${it.id}','packUnit',this.value)">
        </div>
        <div class="field num">
          <label>ใช้ต่อชิ้น</label>
          <input type="number" step="0.01" value="${it.used}"
            oninput="updateIngredientField('${it.id}','used',this.value)">
        </div>
        <div class="field">
          <label>หน่วยที่ใช้</label>
          <input type="text" value="${escapeAttr(it.useUnit)}" placeholder="แผ่น/อัน"
            oninput="updateIngredientField('${it.id}','useUnit',this.value)">
        </div>
      </div>
      <div class="foot">
        <div class="cost-readout" id="readout-${it.id}">ใช้ทั้งหมด ${num(totalUsed)} ${escapeHtml(it.useUnit)} &middot; ซื้อ ${num(packsNeeded, 3)} ${escapeHtml(it.packUnit)} &rarr; <b>${money(cost)}</b></div>
        <button class="btn btn-remove" onclick="removeIngredient('${it.id}')">ลบ</button>
      </div>
    </div>`;
  }).join('');
}

function renderSimpleForm(containerId, list, kind){
  const wrap = document.getElementById(containerId);
  if(list.length === 0){
    wrap.innerHTML = `<div class="empty-hint">ยังไม่มีรายการ${kind === 'equipment' ? 'อุปกรณ์' : 'เครื่องดื่ม'}</div>`;
    return;
  }
  const removeFn = kind === 'equipment' ? 'removeEquipment' : 'removeDrink';
  wrap.innerHTML = list.map(it => `
    <div class="simple-item">
      <div class="field">
        <label>ชื่อรายการ</label>
        <input type="text" value="${escapeAttr(it.name)}" placeholder="เช่น กล่องใส่"
          oninput="updateSimpleField(${kind === 'equipment' ? 'equipment' : 'drinks'}, '${it.id}', 'name', this.value)">
      </div>
      <div class="field num">
        <label>ต้นทุนรวม (บาท)</label>
        <input type="number" step="0.01" value="${it.cost}"
          oninput="updateSimpleField(${kind === 'equipment' ? 'equipment' : 'drinks'}, '${it.id}', 'cost', this.value)">
      </div>
      <button class="btn btn-remove" onclick="${removeFn}('${it.id}')" style="margin-bottom:6px;">ลบ</button>
    </div>
  `).join('');
}

function escapeHtml(s){
  return (s || '').toString().replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeAttr(s){ return escapeHtml(s); }

function computeAndRenderReceipt(){
  const servings = getServings();

  let sandwichTotal = 0;
  const ingRows = ingredients.map(it => {
    const totalUsed = it.used * servings;
    const packsNeeded = it.packQty > 0 ? totalUsed / it.packQty : 0;
    const cost = packsNeeded * it.priceUnit;
    sandwichTotal += cost;
    const label = it.name || '(ไม่มีชื่อ)';
    return `<div class="rline"><span class="lbl">${escapeHtml(label)}</span><span class="val">${money(cost)}</span></div>`;
  }).join('');
  document.getElementById('ingredientReceipt').innerHTML = ingRows || '<div class="rline"><span class="lbl">— ไม่มีวัตถุดิบ —</span></div>';
  document.getElementById('sandwichSubtotalLine').innerHTML = `<span class="lbl">รวมต้นทุนวัตถุดิบ</span><span class="val">${money(sandwichTotal)}</span>`;

  let equipmentTotal = 0;
  const eqRows = equipment.map(it => {
    equipmentTotal += (it.cost || 0);
    const label = it.name || '(ไม่มีชื่อ)';
    return `<div class="rline"><span class="lbl">${escapeHtml(label)}</span><span class="val">${money(it.cost)}</span></div>`;
  }).join('');
  document.getElementById('equipmentReceipt').innerHTML = eqRows || '<div class="rline"><span class="lbl">— ไม่มีอุปกรณ์ —</span></div>';
  document.getElementById('equipmentSubtotalLine').innerHTML = `<span class="lbl">ต้นทุนอุปกรณ์</span><span class="val">${money(equipmentTotal)}</span>`;

  let drinkTotal = 0;
  const drRows = drinks.map(it => {
    drinkTotal += (it.cost || 0);
    const label = it.name || '(ไม่มีชื่อ)';
    return `<div class="rline"><span class="lbl">${escapeHtml(label)}</span><span class="val">${money(it.cost)}</span></div>`;
  }).join('');
  document.getElementById('drinkReceipt').innerHTML = drRows || '<div class="rline"><span class="lbl">— ไม่มีเครื่องดื่ม —</span></div>';
  document.getElementById('drinkSubtotalLine').innerHTML = `<span class="lbl">ต้นทุนเครื่องดื่ม</span><span class="val">${money(drinkTotal)}</span>`;

  const grandTotal = sandwichTotal + equipmentTotal + drinkTotal;
  const perPiece = servings > 0 ? grandTotal / servings : 0;

  document.getElementById('grandTotalLine').innerHTML = `<span class="lbl">รวมทั้งหมด</span><span class="val">${money(grandTotal)}</span>`;
  document.getElementById('perPieceLine').innerHTML = `<span class="lbl">ต้นทุนต่อชิ้น (${num(servings,0)} อัน)</span><span class="val">${money(perPiece)}</span>`;
  document.getElementById('stampTotal').textContent = money(grandTotal);
  document.getElementById('mobileTotal').textContent = money(grandTotal);
}

function renderAll(){
  renderIngredientForm();
  renderSimpleForm('equipmentList', equipment, 'equipment');
  renderSimpleForm('drinkList', drinks, 'drink');
  computeAndRenderReceipt();
}

document.getElementById('servings').addEventListener('input', () => {
  ingredients.forEach(updateIngredientReadout);
  computeAndRenderReceipt();
  saveState();
});

loadState();
renderAll();
</script>
</body>
</html>
